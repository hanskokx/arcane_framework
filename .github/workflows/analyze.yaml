name: Analyze
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "lib/**"
      - "test/**"
      - "example/**"
      - "analysis_options.yaml"
      - "pubspec.yaml"
      - ".github/workflows/analyze.yaml"
jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze