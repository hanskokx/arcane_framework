name: example
description: "A new Flutter project."
publish_to: "none"
version: 0.1.0

environment:
  sdk: ^3.5.3

dependencies:
  arcane_framework:
    path: "../"
  flutter:
    sdk: flutter
  material_ui: any
  uuid: ^4.5.0

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true

dependency_overrides:
  arcane_auth:
    path: "../packages/arcane_auth"
  arcane_environment:
    path: "../packages/arcane_environment"
  arcane_feature_flags:
    path: "../packages/arcane_feature_flags"
  arcane_logger:
    path: "../packages/arcane_logger"
  arcane_service:
    path: "../packages/arcane_service"
  arcane_theme:
    path: "../packages/arcane_theme"
